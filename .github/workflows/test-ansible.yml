name: Test Ansible Connection

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-connection:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Ansible
        run: |
          python -m pip install ansible-core

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Verify secrets are available without printing their contents
          if [ -z "$SSH_KEY" ]; then
            echo "::error::VPS_SSH_KEY is empty or unavailable"
            exit 1
          fi

          if [ -z "$VPS_HOST_KEY" ]; then
            echo "::error::VPS_HOST_KEY is empty or unavailable"
            exit 1
          fi

          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          printf '%s\n' "$VPS_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          # Verify that the host entry exists
          ssh-keygen -F bank.cfhayes.com > /dev/null || {
            echo "::error::No matching host entry in known_hosts"
            exit 1
          }

          echo "SSH configuration initialized successfully"

      - name: Verify SSH host key
        run: |
          echo "Checking known_hosts entry..."
          ssh-keygen -F bank.cfhayes.com

          echo "Checking host key fingerprint..."
          ssh-keygen -lf ~/.ssh/known_hosts

      - name: Test Ansible connectivity
        run: |
          ansible-playbook \
            -i ansible/inventory.ini \
            ansible/test-connection.yml
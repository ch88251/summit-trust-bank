---
- name: Deploy Summit Trust Bank
  hosts: production
  gather_facts: false

  tasks:
    - name: Pull latest application image
      ansible.builtin.command:
        cmd: docker compose pull app
        chdir: /opt/summit-trust-bank
      changed_when: true

    - name: Recreate application container
      ansible.builtin.command:
        cmd: docker compose up -d --no-deps --wait app
        chdir: /opt/summit-trust-bank
      changed_when: true

    - name: Verify application over HTTPS
      ansible.builtin.uri:
        url: https://bank.cfhayes.com/docs
        status_code: 200
        timeout: 15
      delegate_to: localhost
      run_once: true